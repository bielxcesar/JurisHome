<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JurisHome - Configuração</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/confAdm.css">
</head>
<body>

    <div class="conf-box">
        <header class="conf-header">
            <button class="btn-back" id="btn-voltar" title="Voltar">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1>Troca de senha</h1>
            <button class="btn-theme" title="Alternar Tema">
                <i class="fa-regular fa-moon"></i>
            </button>
        </header>

        <div class="conf-body">
            <aside class="conf-sidebar">
                <nav class="sidebar-menu">
                    <a href="#" class="sidebar-item">
                        <i class="fa-regular fa-file-lines"></i>
                        <span>Termos de uso</span>
                    </a>
                    <a href="#" class="sidebar-item">
                        <i class="fa-solid fa-shield-halved"></i>
                        <span>Privacidade</span>
                    </a>
                    <a href="#" class="sidebar-item active">
                        <i class="fa-solid fa-key"></i>
                        <span>Trocar senha</span>
                    </a>
                    <a href="#" class="sidebar-item">
                        <i class="fa-regular fa-comment-dots"></i>
                        <span>Feedback</span>
                    </a>
                    <a href="#" class="sidebar-item">
                        <i class="fa-regular fa-clipboard"></i>
                        <span>Log</span>
                    </a>
                </nav>

                <div class="sidebar-footer">
                    <a href="/" class="btn-desconectar-side">
                        <i class="fa-solid fa-power-off"></i>
                        <span>Desconectar</span>
                    </a>
                </div>
            </aside>

            <main class="conf-content">
                <!-- Alerta de Sucesso (Oculto por padrão) -->
                <div class="alert-success" id="alert-sucesso">
                    Alterado com sucesso
                </div>

                <form id="form-troca-senha" class="form-senha">
                    <div class="form-group">
                        <label for="senha-atual">Senha:</label>
                        <input type="password" id="senha-atual" placeholder="Senha" required>
                    </div>

                    <div class="form-group">
                        <label for="nova-senha">Nova senha:</label>
                        <input type="password" id="nova-senha" placeholder="Senha nova" required>
                    </div>

                    <div class="form-group">
                        <label for="confirma-senha">Confirmar senha:</label>
                        <input type="password" id="confirma-senha" placeholder="Confirma senha" required>
                    </div>

                    <button type="submit" class="btn-salvar">Salvar Alteração</button>
                </form>
            </main>
        </div>
    </div>

    <script src="/static/js/confAdm.js"></script>
</body>
</html>
