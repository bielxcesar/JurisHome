{% macro voltar_principal(destino, classe="", com_seta_circular=false, mostrar_texto=true) -%}
<a href="{{ destino }}"{% if com_seta_circular %} class="juris-voltar {{ classe }}" aria-label="Voltar à tela principal"{% elif classe %} class="{{ classe }}"{% endif %}>
    {% if com_seta_circular %}<span class="juris-voltar-icone">{% endif %}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" style="display:inline-block;vertical-align:-.15em">
        <path d="M19 12H5m7 7-7-7 7-7"/>
    </svg>
    {% if com_seta_circular %}</span>{% if mostrar_texto %}<span>Voltar</span>{% endif %}{% else %}<span>Voltar à tela principal</span>{% endif %}
</a>
{%- endmacro %}
