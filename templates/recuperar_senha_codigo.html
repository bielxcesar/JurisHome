<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação de segurança | JurisHome</title>
    <link rel="stylesheet" href="/static/css/login.css?v=20260925-4">
    <link rel="stylesheet" href="/static/css/auth-figma.css?v=20260925-1">
    <link rel="stylesheet" href="/static/css/legal.css?v=20260925-3">
</head>
<body class="bg-recovery">
    <div class="overlay-login"></div>
    <main class="auth-panel recovery-panel">
        <header class="recovery-header">
            <a class="recovery-back" href="/recuperar-senha" aria-label="Voltar">
                <img src="/static/images/icon-voltar.png" alt="">
            </a>
            <h1>Duas etapas</h1>
        </header>
        <div class="recovery-divider"></div>
        <p class="recovery-copy">Informe o código de seis dígitos do aplicativo autenticador para <strong id="recovery-address"></strong>.</p>
        <form id="form-recuperacao-codigo" class="recovery-form" novalidate>
            <div class="input-group">
                <label for="recuperacao-codigo">Código</label>
                <input id="recuperacao-codigo" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
            </div>
            <p class="auth-message" id="auth-message" role="alert" hidden></p>
            <button class="recovery-submit" type="submit">Próximo</button>
        </form>
    </main>
    {% include "_legal_links.html" %}
    <script src="/static/js/auth.js?v=20260926-2"></script>
</body>
</html>
