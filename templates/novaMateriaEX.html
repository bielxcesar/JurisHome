<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pré-visualização da Matéria - JurisHome</title>
    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        (function() {
            const temaSalvo = localStorage.getItem("tema_juris");
            if (temaSalvo === "claro") {
                document.documentElement.classList.remove("dark");
            } else {
                document.documentElement.classList.add("dark");
            }
        })();
    </script>
</head>
<body class="bg-[#1e1e1e] text-gray-200 font-sans antialiased min-h-screen flex flex-col">

  <!-- Barra de Navegação Padrão -->
  <header class="bg-[#25262a] border-b border-gray-800 px-6 py-4 flex flex-wrap items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-4">
        <button onclick="window.close()" class="bg-[#1e1e1e] border border-gray-600 hover:border-amber-500 hover:text-amber-500 text-gray-300 px-4 py-2 rounded-xl transition flex items-center gap-2 text-sm shadow-md cursor-pointer">
            <i class="fa-solid fa-xmark"></i>
            <span>Retornar (Fechar aba)</span>
        </button>
        <span class="text-gray-400 text-sm hidden md:block font-mono" id="data-atual">--/--/----</span>
    </div>

    <nav class="flex flex-1 md:justify-center gap-4 md:gap-8 overflow-x-auto whitespace-nowrap scrollbar-hide text-sm md:text-base">
        <a href="/home_admin" class="text-gray-300 hover:text-amber-500 pb-1 flex items-center gap-2 transition"><i class="fa-solid fa-house text-amber-500"></i> Início</a>
        <a href="/exibir-mais" class="text-gray-300 hover:text-amber-500 pb-1 flex items-center gap-2 transition"><i class="fa-solid fa-square-plus text-amber-500"></i> Exibir mais</a>
        <a href="/admin-feedbacks" class="text-gray-300 hover:text-amber-500 pb-1 flex items-center gap-2 transition"><i class="fa-solid fa-headset text-amber-500"></i> Feedback</a>
        <a href="/categorias" class="text-gray-300 hover:text-amber-500 pb-1 flex items-center gap-2 transition"><i class="fa-solid fa-newspaper text-amber-500"></i> Categorias</a>
        <a href="/pesquisa" class="text-gray-300 hover:text-amber-500 pb-1 flex items-center gap-2 transition"><i class="fa-solid fa-magnifying-glass text-amber-500"></i> Pesquisa</a>
    </nav>
  </header>

  <!-- Conteúdo Principal -->
  <main class="w-full max-w-4xl mx-auto px-4 py-12 flex-1">
    
    <!-- Títulos -->
    <h1 id="ex-titulo" class="text-3xl md:text-4xl font-bold text-white mb-3"></h1>
    <h2 id="ex-subtitulo" class="text-lg md:text-xl text-gray-400 mb-6"></h2>

    <!-- Metadados -->
    <div class="flex flex-wrap justify-between items-center border-b border-gray-700 pb-4 mb-8 text-sm text-gray-400 gap-2">
      <div>
        <span>Divulgado por: <strong class="text-amber-500">Administrador</strong></span>
        <span class="mx-2">•</span>
        <span id="data-criacao-materia">12/08/2026</span>
      </div>
      <div id="ex-link-container"></div>
    </div>

    <!-- Imagem Principal / Miniatura -->
    <div id="container-img-principal" class="hidden mb-8">
      <figure class="rounded-2xl overflow-hidden border border-gray-800 bg-[#25262a]">
        <img id="ex-img-principal" src="" alt="Miniatura da matéria" class="w-full max-h-[450px] object-cover" />
        <figcaption id="ex-fonte-miniatura" class="p-3 text-xs text-gray-400 italic bg-[#25262a] border-t border-gray-800"></figcaption>
      </figure>
    </div>

    <!-- Corpo do Artigo com Imagens Extras Integradas -->
    <article id="ex-corpo-artigo" class="text-gray-200 text-lg leading-relaxed space-y-6">
      <!-- O texto e as imagens extras serão injetados aqui ordenadamente -->
    </article>

    <!-- Rodapé e Tags -->
    <footer class="mt-16 border-t border-gray-700 pt-6">
      <div class="flex flex-wrap gap-2 items-center mb-4">
        <span class="font-bold text-sm text-white">Tags:</span>
        <span class="bg-[#25262a] border border-gray-700 text-amber-500 px-3 py-1 rounded-full text-xs font-semibold">direito</span>
        <span class="bg-[#25262a] border border-gray-700 text-amber-500 px-3 py-1 rounded-full text-xs font-semibold">noticia</span>
        <span class="bg-[#25262a] border border-gray-700 text-amber-500 px-3 py-1 rounded-full text-xs font-semibold">juridico</span>
      </div>
      <div id="ex-rodape-fonte" class="text-xs text-gray-500"></div>
    </footer>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
        // Data atual no header
        const elData = document.getElementById("data-atual");
        if(elData) elData.textContent = new Intl.DateTimeFormat("pt-BR").format(new Date());

        // Dados vindos do localStorage
        const dados = JSON.parse(localStorage.getItem('temp_materia_preview') || '{}');

        // Preenche Títulos
        document.getElementById('ex-titulo').textContent = dados.titulo || 'Título não informado';
        document.getElementById('ex-subtitulo').textContent = dados.sub_titulo || '';

        // Link da Fonte Original
        const linkContainer = document.getElementById('ex-link-container');
        const rodapeFonte = document.getElementById('ex-rodape-fonte');
        if (dados.fonte_original) {
            try {
                const host = new URL(dados.fonte_original).hostname;
                linkContainer.innerHTML = `<span>Fonte original: <a href="${dados.fonte_original}" target="_blank" class="text-amber-500 underline hover:text-amber-400">${host}</a></span>`;
                rodapeFonte.innerHTML = `Consulte a matéria fonte original: <a href="${dados.fonte_original}" target="_blank" class="text-amber-500 underline hover:text-amber-400">${dados.fonte_original}</a>`;
            } catch {
                linkContainer.innerHTML = `<span>Fonte original: <a href="${dados.fonte_original}" target="_blank" class="text-amber-500 underline hover:text-amber-400">Acessar Link</a></span>`;
            }
        }

        // Imagem Principal / Miniatura
        const miniaturaUrl = dados.miniatura || dados.imagem_principal;
        const miniaturaFonte = dados.fonte_miniatura || dados.fonte_imagem_principal;
        if (miniaturaUrl) {
            document.getElementById('ex-img-principal').src = miniaturaUrl;
            document.getElementById('container-img-principal').classList.remove('hidden');
            if (miniaturaFonte) {
                document.getElementById('ex-fonte-miniatura').textContent = "Imagem proporcionada por: " + miniaturaFonte;
            }
        }

        // Coleta todas as imagens extras preenchidas
        const imagensExtras = [];
        if (dados.corpo_1) imagensExtras.push({ url: dados.corpo_1, fonte: dados.fonte_corpo_1 });
        if (dados.corpo_2) imagensExtras.push({ url: dados.corpo_2, fonte: dados.fonte_corpo_2 });
        if (dados.corpo_3) imagensExtras.push({ url: dados.corpo_3, fonte: dados.fonte_corpo_3 });

        // Tratamento e distribuição inteligente do texto e das imagens
        const corpoArtigo = document.getElementById('ex-corpo-artigo');
        const textoCompleto = dados.corpo_texto || 'Nenhum texto informado.';
        
        // Divide o texto por quebras de linha ou o fatia em pedaços proporcionais se for um bloco único muito longo
        let pedacosTexto = textoCompleto.split('\n').filter(p => p.trim() !== '');
        
        if (pedacosTexto.length === 1 && textoCompleto.length > 300) {
            // Se o usuário colou um texto corrido gigante sem enter, dividimos em blocos menores para intercalar
            const tamanhoBloco = Math.ceil(textoCompleto.length / (imagensExtras.length + 1));
            pedacosTexto = [];
            for (let i = 0; i < textoCompleto.length; i += tamanhoBloco) {
                pedacosTexto.push(textoCompleto.substring(i, i + tamanhoBloco));
            }
        } else if (pedacosTexto.length === 0) {
            pedacosTexto = [textoCompleto];
        }

        // Renderiza o primeiro bloco de texto
        const pInicial = document.createElement('p');
        pInicial.className = "break-words whitespace-pre-line";
        pInicial.textContent = pedacosTexto[0];
        corpoArtigo.appendChild(pInicial);

        // Intercala as imagens extras com os blocos seguintes de texto
        imagensExtras.forEach((imgInfo, index) => {
            // Insere a imagem
            const figure = document.createElement('figure');
            figure.className = "rounded-2xl overflow-hidden border border-gray-800 bg-[#25262a] my-8";
            
            let htmlImg = `<img src="${imgInfo.url}" alt="Imagem complementar" class="w-full max-h-[400px] object-cover" />`;
            if (imgInfo.fonte) {
                htmlImg += `<figcaption class="p-3 text-xs text-gray-400 italic bg-[#25262a] border-t border-gray-800">Imagem proporcionada por: ${imgInfo.fonte}</figcaption>`;
            }
            figure.innerHTML = htmlImg;
            corpoArtigo.appendChild(figure);

            // Insere o próximo bloco de texto correspondente (se houver)
            const textoBloco = pedacosTexto[index + 1] || pedacosTexto[pedacosTexto.length - 1];
            if (textoBloco && imagensExtras.length > index) {
                const pExtra = document.createElement('p');
                pExtra.className = "break-words whitespace-pre-line";
                pExtra.textContent = textoBloco;
                corpoArtigo.appendChild(pExtra);
            }
        });
    });
  </script>
</body>
</html>
