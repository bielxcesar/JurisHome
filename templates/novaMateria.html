<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Matéria - JurisHome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .borda-destaque { border-color: #F59E0B; } 
        .bg-destaque { background-color: #F59E0B; }
        dialog::backdrop { background: rgba(0, 0, 0, 0.9); }
        .preview-body a { color: #F59E0B; text-decoration: underline; }
        .box-imagem-fundo {
            background-color: #1a1a1a;
            border: 2px dashed #4b5563;
            transition: all 0.3s ease;
        }
        .box-imagem-fundo:hover {
            border-color: #F59E0B;
        }
    </style>
</head>
<body class="bg-[#1e1e1e] text-white font-sans antialiased min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-4xl border-4 borda-destaque rounded-lg p-8 relative bg-[#121212]">
        <a href="/home_admin" class="absolute top-4 left-4 text-gray-400 hover:text-white flex items-center">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 15l-3-3m0 0l3-3m-3 3h8M3 12a9 9 0 1118 0 9 9 0 01-18 0z"></path></svg>
        </a>

        <h1 class="text-3xl font-semibold text-center mb-8 mt-2">Nova Matéria</h1>

        <form id="form-nova-materia" class="space-y-6">
            <div class="flex items-center gap-4">
                <label for="titulo" class="w-32 text-right">Título:*</label>
                <input type="text" id="titulo" required class="flex-1 bg-transparent border rounded border-gray-500 p-2 text-white focus:outline-none focus:border-[#F59E0B]">
            </div>

            <div class="flex items-center gap-4">
                <label for="sub_titulo" class="w-32 text-right">Sub-Título:</label>
                <input type="text" id="sub_titulo" class="flex-1 bg-transparent border rounded border-gray-500 p-2 text-white focus:outline-none focus:border-[#F59E0B]">
            </div>

            <div class="flex items-center gap-4">
                <label for="categoria_id" class="w-32 text-right">Categoria:*</label>
                <select id="categoria_id" required class="flex-1 bg-[#1e1e1e] border rounded border-gray-500 p-2 text-white focus:outline-none focus:border-[#F59E0B]">
                    <option value="" disabled selected>Selecione uma categoria</option>
                    <option value="ID_DIREITO_TRABALHISTA">Direito Trabalhista</option>
                    <option value="ID_DIREITO_PENAL">Direito Penal</option>
                </select>
            </div>

            <div class="flex items-center gap-4">
                <label for="tipo_fonte" class="w-32 text-right">Tipo da Fonte:*</label>
                <input list="fontes-list" id="tipo_fonte" required placeholder="Ex: g1, uol, x, terra, instagram..." class="flex-1 bg-transparent border rounded border-gray-500 p-2 text-white focus:outline-none focus:border-[#F59E0B]">
                <datalist id="fontes-list">
                    <option value="g1">G1</option>
                    <option value="terra">Terra</option>
                    <option value="uol">UOL</option>
                    <option value="x">X (Twitter)</option>
                    <option value="instagram">Instagram</option>
                    <option value="acordao">Acórdão</option>
                    <option value="doutrina">Doutrina</option>
                    <option value="legislacao">Legislação</option>
                </datalist>
            </div>

            <div class="flex items-start gap-4">
                <label for="corpo_texto" class="w-32 text-right mt-2">Corpo do<br>Texto:*</label>
                <div class="flex-1">
                    <textarea id="corpo_texto" required rows="6" placeholder="Escreva o texto da matéria..." class="w-full bg-transparent border rounded border-gray-500 p-2 text-white focus:outline-none focus:border-[#F59E0B]"></textarea>
                </div>
            </div>

            <!-- SEÇÃO DE IMAGENS -->
            <div class="border-t border-gray-700 pt-4">
                <span class="block font-semibold mb-4 text-amber-500">Imagens (Miniatura e Corpo com medidas 600×400):</span>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <!-- 1. MINIATURA -->
                    <div class="space-y-2">
                        <label class="block text-sm text-gray-300">Miniatura (Principal)*</label>
                        <div class="relative box-imagem-fundo h-48 rounded flex flex-col items-center justify-center cursor-pointer overflow-hidden p-2">
                            <input type="file" id="input_miniatura" accept="image/*" required class="absolute inset-0 opacity-0 cursor-pointer z-10" onchange="mostrarPreviewCaixa(this, 'preview_miniatura', 'texto_miniatura')">
                            
                            <img id="preview_miniatura" class="absolute inset-0 w-full h-full object-cover hidden" alt="Miniatura">
                            
                            <div id="texto_miniatura" class="text-center">
                                <span class="block text-lg font-bold text-gray-300">Miniatura</span>
                                <span class="text-xs text-amber-500 font-mono mt-1 block">600×400</span>
                                <span class="text-[10px] text-gray-400 block mt-2">Clique para enviar imagem</span>
                            </div>
                        </div>
                        <input type="text" id="fonte_miniatura" placeholder="Fonte da miniatura..." class="w-full bg-transparent border rounded border-gray-500 p-1.5 text-xs text-white focus:outline-none focus:border-[#F59E0B]">
                    </div>

                    <!-- 2. IMAGEM CORPO 1 -->
                    <div class="space-y-2">
                        <label class="block text-sm text-gray-300">Imagem no Corpo 1</label>
                        <div class="relative box-imagem-fundo h-48 rounded flex flex-col items-center justify-center cursor-pointer overflow-hidden p-2">
                            <input type="file" id="input_corpo_1" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-10" onchange="mostrarPreviewCaixa(this, 'preview_corpo_1', 'texto_corpo_1')">
                            
                            <img id="preview_corpo_1" class="absolute inset-0 w-full h-full object-cover hidden" alt="Corpo 1">
                            
                            <div id="texto_corpo_1" class="text-center">
                                <span class="block text-lg font-bold text-gray-300">Imagem no corpo</span>
                                <span class="text-xs text-amber-500 font-mono mt-1 block">600×400</span>
                                <span class="text-[10px] text-gray-400 block mt-2">Clique para enviar imagem</span>
                            </div>
                        </div>
                        <input type="text" id="fonte_corpo_1" placeholder="Fonte da imagem..." class="w-full bg-transparent border rounded border-gray-500 p-1.5 text-xs text-white focus:outline-none focus:border-[#F59E0B]">
                    </div>

                    <!-- 3. IMAGEM CORPO 2 -->
                    <div class="space-y-2">
                        <label class="block text-sm text-gray-300">Imagem no Corpo 2</label>
                        <div class="relative box-imagem-fundo h-36 rounded flex flex-col items-center justify-center cursor-pointer overflow-hidden p-2">
                            <input type="file" id="input_corpo_2" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-10" onchange="mostrarPreviewCaixa(this, 'preview_corpo_2', 'texto_corpo_2')">
                            
                            <img id="preview_corpo_2" class="absolute inset-0 w-full h-full object-cover hidden" alt="Corpo 2">
                            
                            <div id="texto_corpo_2" class="text-center">
                                <span class="text-sm font-bold text-gray-300">Corpo 2</span>
                                <span class="text-[10px] text-amber-500 font-mono block">600×400</span>
                            </div>
                        </div>
                        <input type="text" id="fonte_corpo_2" placeholder="Fonte..." class="w-full bg-transparent border rounded border-gray-500 p-1 text-xs text-white">
                    </div>

                    <!-- 4. IMAGEM CORPO 3 -->
                    <div class="space-y-2">
                        <label class="block text-sm text-gray-300">Imagem no Corpo 3</label>
                        <div class="relative box-imagem-fundo h-36 rounded flex flex-col items-center justify-center cursor-pointer overflow-hidden p-2">
                            <input type="file" id="input_corpo_3" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-10" onchange="mostrarPreviewCaixa(this, 'preview_corpo_3', 'texto_corpo_3')">
                            
                            <img id="preview_corpo_3" class="absolute inset-0 w-full h-full object-cover hidden" alt="Corpo 3">
                            
                            <div id="texto_corpo_3" class="text-center">
                                <span class="text-sm font-bold text-gray-300">Corpo 3</span>
                                <span class="text-[10px] text-amber-500 font-mono block">600×400</span>
                            </div>
                        </div>
                        <input type="text" id="fonte_corpo_3" placeholder="Fonte..." class="w-full bg-transparent border rounded border-gray-500 p-1 text-xs text-white">
                    </div>

                </div>
            </div>

            <div class="flex items-center gap-4 pt-4">
                <label for="resumo_home" class="w-32 text-right">Resumo da<br>Home:*</label>
                <input type="text" id="resumo_home" required class="flex-1 bg-transparent border rounded border-gray-500 p-2 text-white focus:outline-none focus:border-[#F59E0B]">
            </div>

            <div class="flex items-center gap-4">
                <label for="fonte_original" class="w-32 text-right">Fonte original:*</label>
                <input type="url" id="fonte_original" required placeholder="https://..." class="flex-1 bg-transparent border rounded border-gray-500 p-2 text-white focus:outline-none focus:border-[#F59E0B]">
            </div>

            <div class="flex justify-end gap-4 mt-8">
                <button type="button" id="btn-preview" class="bg-transparent border border-[#F59E0B] text-[#F59E0B] px-6 py-2 rounded font-bold hover:bg-[#F59E0B] hover:text-black transition">Pré visualizar</button>
                <button type="submit" id="btn-enviar" class="bg-destaque text-black px-6 py-2 rounded font-bold hover:opacity-80 transition">Enviar</button>
            </div>
        </form>

        <!-- Div de feedback para mensagens de retorno na tela -->
        <div id="mensagem-retorno" class="mt-4 text-center font-bold hidden"></div>
    </div>

    <script>
        // Função para exibir o preview visual imediato da imagem selecionada
        function mostrarPreviewCaixa(inputElement, previewId, textoId) {
            const previewContainer = document.getElementById(previewId);
            const textoContainer = document.getElementById(textoId);
            
            if (inputElement.files && inputElement.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    if (previewContainer) {
                        previewContainer.src = e.target.result;
                        previewContainer.classList.remove('hidden');
                    }
                    if (textoContainer) {
                        textoContainer.classList.add('hidden');
                    }
                }
                reader.readAsDataURL(inputElement.files[0]);
            }
        }

        // Função de compressão otimizada
        async function comprimirImagem(inputElement) {
            return new Promise((resolve) => {
                if (!inputElement || !inputElement.files || !inputElement.files[0]) {
                    return resolve('');
                }
                const file = inputElement.files[0];
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
                reader.readAsDataURL(file);
            });
        }

        // Envio do formulário via fetch com validação das fontes de imagem
        document.addEventListener('DOMContentLoaded', () => {
            const formNovaMateria = document.getElementById('form-nova-materia');
            const msgRetorno = document.getElementById('mensagem-retorno');

            if (formNovaMateria) {
                formNovaMateria.addEventListener('submit', async (e) => {
                    e.preventDefault(); // Impede o recarregamento padrão da página

                    // Mapeia os pares de inputs de imagem e suas respectivas fontes
                    const paresImagens = [
                        { input: document.getElementById('input_miniatura'), fonte: document.getElementById('fonte_miniatura'), nome: 'Miniatura (Principal)' },
                        { input: document.getElementById('input_corpo_1'), fonte: document.getElementById('fonte_corpo_1'), nome: 'Imagem no Corpo 1' },
                        { input: document.getElementById('input_corpo_2'), fonte: document.getElementById('fonte_corpo_2'), nome: 'Imagem no Corpo 2' },
                        { input: document.getElementById('input_corpo_3'), fonte: document.getElementById('fonte_corpo_3'), nome: 'Imagem no Corpo 3' }
                    ];

                    // Valida se cada imagem anexada possui a sua respectiva fonte preenchida
                    for (let par of paresImagens) {
                        if (par.input && par.input.files && par.input.files.length > 0) {
                            if (!par.fonte || !par.fonte.value.trim()) {
                                alert(`A fonte da imagem "${par.nome}" é obrigatória porque uma imagem foi anexada.`);
                                par.fonte.focus();
                                return;
                            }
                        }
                    }

                    msgRetorno.textContent = "Compactando imagens e enviando matéria...";
                    msgRetorno.className = "mt-4 text-center font-bold text-amber-500 block";

                    try {
                        // Comprime todas as imagens antes de enviar
                        const miniaturaComprimida = await comprimirImagem(document.getElementById('input_miniatura'));
                        const corpo1Comprimida = await comprimirImagem(document.getElementById('input_corpo_1'));
                        const corpo2Comprimida = await comprimirImagem(document.getElementById('input_corpo_2'));
                        const corpo3Comprimida = await comprimirImagem(document.getElementById('input_corpo_3'));

                        const dadosMateria = {
                            titulo: document.getElementById('titulo').value,
                            sub_titulo: document.getElementById('sub_titulo').value,
                            categoria_id: document.getElementById('categoria_id').value,
                            tipo_fonte: document.getElementById('tipo_fonte').value,
                            corpo_texto: document.getElementById('corpo_texto').value,
                            resumo_home: document.getElementById('resumo_home').value,
                            fonte_original: document.getElementById('fonte_original').value,
                            
                            miniatura: miniaturaComprimida,
                            fonte_miniatura: document.getElementById('fonte_miniatura')?.value || '',
                            
                            corpo_1: corpo1Comprimida,
                            fonte_corpo_1: document.getElementById('fonte_corpo_1')?.value || '',
                            
                            corpo_2: corpo2Comprimida,
                            fonte_corpo_2: document.getElementById('fonte_corpo_2')?.value || '',
                            
                            corpo_3: corpo3Comprimida,
                            fonte_corpo_3: document.getElementById('fonte_corpo_3')?.value || ''
                        };

                        // Realiza o envio via fetch incluindo credenciais/cookies de admin
                        const resposta = await fetch('/api/materia', {
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            credentials: 'include',
                            body: JSON.stringify(dadosMateria)
                        });

                        if (resposta.ok) {
                            msgRetorno.textContent = "Matéria cadastrada com sucesso!";
                            msgRetorno.className = "mt-4 text-center font-bold text-green-500 block";
                            formNovaMateria.reset();
                            setTimeout(() => { window.location.href = '/home_admin'; }, 2000);
                        } else {
                            const erroData = await resposta.json().catch(() => ({}));
                            throw new Error(erroData.detail || "Erro ao salvar no banco de dados.");
                        }

                    } catch (err) {
                        console.error(err);
                        msgRetorno.textContent = "Erro ao enviar: " + err.message;
                        msgRetorno.className = "mt-4 text-center font-bold text-red-500 block";
                    }
                });
            }

            // Evento de clique do botão de pré-visualização
            const btnPreview = document.getElementById('btn-preview');
            if (btnPreview) {
                btnPreview.addEventListener('click', async () => {
                    const miniaturaComprimida = await comprimirImagem(document.getElementById('input_miniatura'));
                    const corpo1Comprimida = await comprimirImagem(document.getElementById('input_corpo_1'));
                    const corpo2Comprimida = await comprimirImagem(document.getElementById('input_corpo_2'));
                    const corpo3Comprimida = await comprimirImagem(document.getElementById('input_corpo_3'));

                    const dadosMateria = {
                        titulo: document.getElementById('titulo').value,
                        sub_titulo: document.getElementById('sub_titulo').value,
                        corpo_texto: document.getElementById('corpo_texto').value,
                        fonte_original: document.getElementById('fonte_original').value,
                        
                        miniatura: miniaturaComprimida,
                        fonte_miniatura: document.getElementById('fonte_miniatura')?.value || '',
                        
                        corpo_1: corpo1Comprimida,
                        fonte_corpo_1: document.getElementById('fonte_corpo_1')?.value || '',
                        
                        corpo_2: corpo2Comprimida,
                        fonte_corpo_2: document.getElementById('fonte_corpo_2')?.value || '',
                        
                        corpo_3: corpo3Comprimida,
                        fonte_corpo_3: document.getElementById('fonte_corpo_3')?.value || ''
                    };

                    try {
                        localStorage.setItem('temp_materia_preview', JSON.stringify(dadosMateria));
                        window.open('/preview-materia', '_blank');
                    } catch (e) {
                        alert("O tamanho dos arquivos excede o limite. Tente usar imagens menores.");
                        console.error(e);
                    }
                });
            }
        });
    </script>
</body>
</html>
